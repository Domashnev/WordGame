<table class="field">
  @for (r of field.getRowNumbers(); track $index) {
  <tr>
    @for (cell of field.getRow(r); track cell.id) {
    <td [className]="cell.styles">
      @if (cell.letter) {
        <app-letter [letter]="cell.letter" [draggable]="!cell.disable"></app-letter>
      } else {
      {{cell.info}}
      }
    </td>
    }
  </tr>
  }
</table>
